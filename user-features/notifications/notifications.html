<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Student Portal</title>
    <link rel="stylesheet" href="../../admin.css">
    <link rel="stylesheet" href="notifications.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div id="toastContainer" aria-live="polite"></div>
    <div class="admin-container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-graduation-cap"></i> Student Portal</h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="../dashboard/dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="../exams/exams.html"><i class="fas fa-calendar-alt"></i> Exam Timetable</a></li>
                <li><a href="../room-assignments/room-assignments.html"><i class="fas fa-door-open"></i> Room Assignments</a></li>
                <li><a href="notifications.html" class="active"><i class="fas fa-bell"></i> Notifications</a></li>
                <li><a href="../profile/profile.html"><i class="fas fa-user-circle"></i> Profile</a></li>
                <li><a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="header">
                <h1><i class="fas fa-bell"></i> Notifications</h1>
                <div class="user-info">
                    <span id="currentDateTime"></span>
                    <span>Student</span>
                    <i class="fas fa-user-circle"></i>
                    <button id="logoutBtn" class="btn btn-secondary" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </div>

            <div class="content-wrapper">
                <!-- Controls Section -->
                <div class="controls-section">
                    <div class="control-group">
                        <button id="markAllReadBtn" class="btn btn-secondary">
                            <i class="fas fa-check-double"></i> Mark All Read
                        </button>
                        <button id="clearAllBtn" class="btn btn-secondary">
                            <i class="fas fa-trash-alt"></i> Clear All
                        </button>
                    </div>
                    <div class="filter-group">
                        <select id="statusFilter">
                            <option value="">All Status</option>
                            <option value="unread">Unread</option>
                            <option value="read">Read</option>
                        </select>
                        <select id="typeFilter">
                            <option value="">All Types</option>
                            <option value="info">Information</option>
                            <option value="warning">Warning</option>
                            <option value="alert">Alert</option>
                        </select>
                    </div>
                </div>

                <!-- Notifications List -->
                <div class="notifications-container">
                    <div class="notification-list" id="notificationList">
                        <!-- Notifications will be populated by JavaScript -->
                    </div>
                </div>

                <!-- Removed pagination -->
            </div>
        </main>
    </div>

    <script src="../../utils.js"></script>
    <script src="notifications.js"></script>
</body>
</html>
