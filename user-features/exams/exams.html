<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Timetable - Student Portal</title>
    <link rel="stylesheet" href="../../admin.css">
    <link rel="stylesheet" href="exams.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div id="toastContainer" aria-live="polite"></div>
    <div class="admin-container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2>Student Portal</h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="../dashboard/dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="exams.html" class="active"><i class="fas fa-calendar-alt"></i> Exam Timetable</a></li>
                <li><a href="../seating/seating.html"><i class="fas fa-chair"></i> Seating Arrangement</a></li>
                <li><a href="../notifications/notifications.html"><i class="fas fa-bell"></i> Notifications</a></li>
                <li><a href="../profile/profile.html"><i class="fas fa-user-circle"></i> Profile</a></li>
                <li><a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="header">
                <h1><i class="fas fa-calendar-alt"></i> Exam Timetable</h1>
                <div class="user-info">
                    <span id="currentDateTime"></span>
                    <span>Student</span>
                    <i class="fas fa-user-circle"></i>
                    <button id="logoutBtn" class="btn btn-secondary" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </div>

            <div class="content-wrapper">
                <!-- Controls Section -->
                <div class="controls-section">
                    <div class="control-group">
                        <select id="subjectFilter">
                            <option value="">All Subjects</option>
                            <option value="Mathematics">Mathematics</option>
                            <option value="Physics">Physics</option>
                            <option value="Chemistry">Chemistry</option>
                            <option value="Biology">Biology</option>
                            <option value="English">English</option>
                        </select>
                        <select id="dateFilter">
                            <option value="">All Dates</option>
                            <option value="upcoming">Upcoming Exams</option>
                            <option value="past">Past Exams</option>
                        </select>
                    </div>
                    <div class="search-group">
                        <div class="search-box">
                            <i class="fas fa-search"></i>
                            <input type="text" id="examSearch" placeholder="Search exams by subject or date...">
                        </div>
                    </div>
                </div>

                <!-- Exam Schedule -->
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Date & Time</th>
                                <th>Subject</th>
                                <th>Exam Code</th>
                                <th>Duration</th>
                                <th>Room</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="examsTableBody">
                            <!-- Exam data will be populated by JavaScript -->
                        </tbody>
                    </table>
                    
                    <!-- Pagination Controls -->
                    <div class="pagination-container">
                        <div class="pagination-info">
                            <span id="paginationInfo">Showing 0-0 of 0 exams</span>
                        </div>
                        <div class="pagination-controls">
                            <button id="firstPageBtn" class="btn btn-secondary" disabled>
                                <i class="fas fa-angle-double-left"></i> First
                            </button>
                            <button id="prevPageBtn" class="btn btn-secondary" disabled>
                                <i class="fas fa-angle-left"></i> Previous
                            </button>
                            <span class="page-numbers">
                                <input type="number" id="pageInput" min="1" value="1" class="page-input">
                                <span>of <span id="totalPages">1</span></span>
                            </span>
                            <button id="nextPageBtn" class="btn btn-secondary">
                                Next <i class="fas fa-angle-right"></i>
                            </button>
                            <button id="lastPageBtn" class="btn btn-secondary">
                                Last <i class="fas fa-angle-double-right"></i>
                            </button>
                        </div>
                        <div class="page-size-selector">
                            <label for="pageSizeSelect">Items per page:</label>
                            <select id="pageSizeSelect">
                                <option value="10">10</option>
                                <option value="25" selected>25</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Statistics Section -->
                <div class="stats-section">
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-calendar-check"></i>
                        </div>
                        <div class="stat-content">
                            <h3 id="totalExams">0</h3>
                            <p>Total Exams</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-clock"></i>
                        </div>
                        <div class="stat-content">
                            <h3 id="upcomingExams">0</h3>
                            <p>Upcoming Exams</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-calendar-day"></i>
                        </div>
                        <div class="stat-content">
                            <h3 id="nextExamDate">-</h3>
                            <p>Next Exam Date</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../utils.js"></script>
    <script src="exams.js"></script>
</body>
</html>
