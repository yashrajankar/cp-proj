<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Timetable - Student Portal</title>
    <link rel="stylesheet" href="../../admin.css">
    <link rel="stylesheet" href="exams.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="toastContainer" aria-live="polite"></div>
    <div class="admin-container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-graduation-cap"></i> Student Portal</h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="../dashboard/dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="exams.html" class="active"><i class="fas fa-calendar-alt"></i> Exam Timetable</a></li>
                <li><a href="../room-assignments/room-assignments.html"><i class="fas fa-door-open"></i> Room Assignments</a></li>
                <li><a href="../notifications/notifications.html"><i class="fas fa-bell"></i> Notifications</a></li>
                <li><a href="../profile/profile.html"><i class="fas fa-user-circle"></i> Profile</a></li>
                <li><a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="header">
                <h1><i class="fas fa-calendar-alt"></i> Exam Timetable</h1>
                <div class="user-info">
                    <span id="currentDateTime"></span>
                    <span>Student</span>
                    <i class="fas fa-user-circle"></i>
                    <button id="logoutBtn" class="btn btn-secondary" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </div>

            <div class="content-wrapper">
                <!-- Controls Section -->
                <div class="controls-section">
                    <div class="control-group">
                        <div class="dropdown">
                            <button id="exportTimetableBtn" class="btn btn-secondary dropdown-toggle">
                                <i class="fas fa-file-export"></i> Export
                            </button>
                            <div class="dropdown-menu" id="exportTimetableDropdown">
                                <button class="dropdown-item" id="exportTimetablePdfBtn">
                                    <i class="fas fa-file-pdf"></i> Export as PDF
                                </button>
                                <button class="dropdown-item" id="exportTimetableCsvBtn">
                                    <i class="fas fa-file-csv"></i> Export as CSV
                                </button>
                                <button class="dropdown-item" id="exportTimetableExcelBtn">
                                    <i class="fas fa-file-excel"></i> Export as Excel
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="filter-group">
                        <select id="statusFilter">
                            <option value="">All Statuses</option>
                            <option value="Scheduled">Scheduled</option>
                            <option value="Completed">Completed</option>
                            <option value="Cancelled">Cancelled</option>
                        </select>
                        <select id="dateFilter">
                            <option value="">All Dates</option>
                            <option value="upcoming">Upcoming</option>
                            <option value="past">Past</option>
                        </select>
                    </div>
                    <div class="search-group">
                        <div class="search-box">
                            <i class="fas fa-search"></i>
                            <input type="text" id="timetableSearch" placeholder="Search exams by code or subject...">
                        </div>
                    </div>
                </div>

                <!-- Exam Table -->
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Exam Code</th>
                                <th>Subject</th>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="timetableTableBody">
                            <!-- Exam rows will be populated by JavaScript -->
                        </tbody>
                    </table>
                    
                </div>

                <!-- Statistics Section -->
                <div class="stats-section">
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-calendar-check"></i>
                        </div>
                        <div class="stat-content">
                            <h3 id="totalEntries">0</h3>
                            <p>Total Exams</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-chalkboard-teacher"></i>
                        </div>
                        <div class="stat-content">
                            <h3 id="totalSubjects">0</h3>
                            <p>Subjects</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-clock"></i>
                        </div>
                        <div class="stat-content">
                            <h3 id="upcomingExams">0</h3>
                            <p>Upcoming Exams</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../utils.js"></script>
    <script src="exams.js"></script>
</body>
</html>
